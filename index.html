            const [copied, setCopied] = useState(false);

            const handleCopy = () => {
                const textarea = document.createElement('textarea');
                textarea.value = text;
                document.body.appendChild(textarea);
                textarea.select();
                document.execCommand('copy');
                document.body.removeChild(textarea);
                setCopied(true);
                setTimeout(() => setCopied(false), 2000);
            };

            return (
                <button
                    onClick={handleCopy}
                    className="inline-flex items-center gap-1.5 px-2.5 py-1 text-xs rounded-md bg-slate-800 hover:bg-cyan-950 text-cyan-300 border border-cyan-800/50 transition-all"
                    title={`Copy ${label || text}`}

                </button>

                        <section id="education" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
                            <div className="flex items-center gap-2 text-cyan-400 text-xs font-mono uppercase tracking-wider mb-1">
                                <Icon name="graduation-cap" className="w-4 h-4" />
                                <span>Academic History</span>
                            </div>
                            <h2 className="text-3xl font-bold tracking-tight">Education</h2>

                            <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                {EDUCATION.map((edu, idx) => (
                                    <div key={idx} className="p-6 rounded-xl bg-slate-900/50 border border-slate-800 space-y-4 flex flex-col justify-between">
                                        <div className="space-y-2">
                                            <div className="flex items-center justify-between">
                                                <span className="text-xs font-mono text-cyan-400">{edu.period}</span>
                                                <span className="px-2 py-0.5 text-[11px] font-semibold rounded bg-emerald-500/10 text-emerald-400 border border-emerald-500/20">
                                                    {edu.honor}
                                                </span>
                                            </div>
                                            <h3 className="text-xl font-bold text-slate-100">{edu.degree}</h3>
                                            <p className="text-xs font-medium text-slate-400">{edu.institution}</p>
                                        </div>

                                        <div className="space-y-2 pt-2 border-t border-slate-800/80">
                                            <div className="text-xs font-semibold text-slate-300">{edu.grade}</div>
                                            <p className="text-xs text-slate-400 leading-relaxed">{edu.details}</p>
                                        </div>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* ================= WORKSHOPS & PRESENTATIONS ================= */}
                        <section id="workshops" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
                            <div className="flex items-center gap-2 text-cyan-400 text-xs font-mono uppercase tracking-wider mb-1">
                                <Icon name="award" className="w-4 h-4" />
                                <span>Credentials & Outreach</span>
                            </div>
                            <h2 className="text-3xl font-bold tracking-tight">Certifications, Workshops & Presentations</h2>

                            <div className="grid grid-cols-1 lg:grid-cols-3 gap-6">
                                <div className="p-6 rounded-xl bg-slate-900/50 border border-slate-800 space-y-4">
                                    <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                                        <Icon name="check" className="w-4 h-4 text-cyan-400" />
                                        <span>Verified Certifications</span>
                                    </h3>
                                    <ul className="space-y-2.5">
                                        {WORKSHOPS_PRESENTATIONS.certifications.map((cert, i) => (
                                            <li key={i} className="text-xs text-slate-300 p-2.5 rounded bg-slate-950 border border-slate-800/80">
                                                {cert}
                                            </li>
                                        ))}
                                    </ul>
                                </div>

                                <div className="p-6 rounded-xl bg-slate-900/50 border border-slate-800 space-y-4">
                                    <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                                        <Icon name="zap" className="w-4 h-4 text-amber-400" />
                                        <span>Specialized Workshops</span>
                                    </h3>
                                    {WORKSHOPS_PRESENTATIONS.workshops.map((ws, i) => (
                                        <div key={i} className="p-3 rounded bg-slate-950 border border-slate-800/80 space-y-1">
                                            <h4 className="text-xs font-bold text-slate-200">{ws.title}</h4>
                                            <p className="text-[11px] text-cyan-400">{ws.organizer}</p>
                                            <p className="text-[11px] text-slate-400">{ws.desc}</p>
                                        </div>
                                    ))}
                                </div>

                                <div className="p-6 rounded-xl bg-slate-900/50 border border-slate-800 space-y-4">
                                    <h3 className="text-base font-bold text-slate-100 flex items-center gap-2">
                                        <Icon name="book-open" className="w-4 h-4 text-indigo-400" />
                                        <span>Conference Presentations</span>
                                    </h3>
                                    {WORKSHOPS_PRESENTATIONS.presentations.map((pres, i) => (
                                        <div key={i} className="p-3 rounded bg-slate-950 border border-slate-800/80 space-y-1">
                                            <h4 className="text-xs font-bold text-slate-200 leading-snug">{pres.title}</h4>
                                            <p className="text-[11px] text-slate-400">{pres.venue}</p>
                                            <span className="inline-block text-[10px] text-indigo-300 font-mono">[{pres.type}]</span>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* ================= CREATIVE JOURNEY ================= */}
                        <section id="creative" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
                            <div className="p-8 sm:p-10 rounded-2xl bg-gradient-to-br from-slate-900 via-slate-950 to-slate-900 border border-slate-800 relative overflow-hidden space-y-8">
                                <div className="flex items-center gap-3">
                                    <div className="p-2.5 rounded-lg bg-rose-500/10 border border-rose-500/30 text-rose-400">
                                        <Icon name="film" className="w-6 h-6" />
                                    </div>
                                    <div>
                                        <h2 className="text-2xl font-bold text-slate-100">{CREATIVE_JOURNEY.title}</h2>
                                        <p className="text-xs text-slate-400 font-mono">{CREATIVE_JOURNEY.subtitle}</p>
                                    </div>
                                </div>

                                <p className="text-xs sm:text-sm text-slate-300 leading-relaxed max-w-3xl">
                                    {CREATIVE_JOURNEY.description}
                                </p>

                                <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-4">
                                    {CREATIVE_JOURNEY.transferableSkills.map((item, idx) => (
                                        <div key={idx} className="p-4 rounded-xl bg-slate-950/80 border border-slate-800 space-y-2">
                                            <h4 className="text-xs font-bold text-rose-300">{item.skill}</h4>
                                            <p className="text-[11px] text-slate-400 leading-relaxed">{item.relevance}</p>
                                        </div>
                                    ))}
                                </div>
                            </div>
                        </section>

                        {/* ================= CAREER GOALS ROADMAP ================= */}
                        <section className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-6">
                            <div className="text-center space-y-2">
                                <h2 className="text-2xl font-bold tracking-tight">Career Goals & Roadmap</h2>
                                <p className="text-xs text-slate-400">Engineering roadmap toward AI/ML domain mastery</p>
                            </div>

                            <div className="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-3 gap-4">
                                {PROFILE_DATA.careerGoals.map((goal, idx) => (
                                    <div key={idx} className="p-4 rounded-xl bg-slate-900/40 border border-slate-800 flex items-start gap-3">
                                        <span className="w-5 h-5 rounded-full bg-cyan-500/10 text-cyan-400 border border-cyan-500/30 text-xs font-mono flex items-center justify-center shrink-0">
                                            {idx + 1}
                                        </span>
                                        <p className="text-xs text-slate-300 leading-snug">{goal}</p>
                                    </div>
                                ))}
                            </div>
                        </section>

                        {/* ================= CONTACT SECTION ================= */}
                        <section id="contact" className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 space-y-8">
                            <div className="text-center space-y-2 max-w-xl mx-auto">
                                <div className="inline-flex items-center gap-2 text-cyan-400 text-xs font-mono uppercase tracking-wider">
                                    <Icon name="mail" className="w-4 h-4" />
                                    <span>Get In Touch</span>
                                </div>
                                <h2 className="text-3xl font-bold tracking-tight">Let's Connect</h2>
                                <p className="text-xs text-slate-400">
                                    Open to Data Analytics, Machine Learning, AI Engineering roles, research collaborations, or technical training engagements.
                                </p>
                            </div>

                            <div className="grid grid-cols-1 lg:grid-cols-12 gap-8 items-start">
                                <div className="lg:col-span-5 space-y-4">
                                    <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 space-y-3">
                                        <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center justify-between">
                                            <span>Email Addresses</span>
                                            <Icon name="mail" className="w-4 h-4 text-cyan-400" />
                                        </div>
                                        {PROFILE_DATA.emails.map((email, i) => (
                                            <div key={i} className="flex items-center justify-between text-xs font-mono bg-slate-950 p-2.5 rounded border border-slate-800">
                                                <span className="truncate mr-2 text-slate-200">{email}</span>
                                                <CopyButton text={email} label="Email" />
                                            </div>
                                        ))}
                                    </div>

                                    <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 space-y-3">
                                        <div className="text-xs font-semibold uppercase tracking-wider text-slate-400 flex items-center justify-between">
                                            <span>Phone Contact</span>
                                            <Icon name="phone" className="w-4 h-4 text-emerald-400" />
                                        </div>
                                        <div className="flex items-center justify-between text-xs font-mono bg-slate-950 p-2.5 rounded border border-slate-800">
                                            <span className="text-slate-200">{PROFILE_DATA.phone}</span>
                                            <CopyButton text={PROFILE_DATA.phone} label="Phone" />
                                        </div>
                                    </div>

                                    <div className="p-5 rounded-xl bg-slate-900/60 border border-slate-800 space-y-3">
                                        <div className="text-xs font-semibold uppercase tracking-wider text-slate-400">Online Profiles</div>
                                        <div className="flex flex-col gap-2">
                                            <a
                                                href={PROFILE_DATA.github}
                                                target="_blank"
                                                rel="noreferrer"
                                                className="flex items-center justify-between p-2.5 rounded bg-slate-950 border border-slate-800 hover:border-slate-700 text-xs text-slate-200 hover:text-cyan-400 transition-colors"
                                            >
                                                <span className="flex items-center gap-2">
                                                    <Icon name="github" className="w-4 h-4 text-slate-400" /> GitHub Profile
                                                </span>
                                                <Icon name="external-link" className="w-3.5 h-3.5" />
                                            </a>

                                            <a
                                                href={PROFILE_DATA.linkedin}
                                                target="_blank"
                                                rel="noreferrer"
                                                className="flex items-center justify-between p-2.5 rounded bg-slate-950 border border-slate-800 hover:border-slate-700 text-xs text-slate-200 hover:text-cyan-400 transition-colors"
                                            >
                                                <span className="flex items-center gap-2">
                                                    <Icon name="linkedin" className="w-4 h-4 text-blue-400" /> LinkedIn Profile
                                                </span>
                                                <Icon name="external-link" className="w-3.5 h-3.5" />
                                            </a>
                                        </div>
                                    </div>
                                </div>

                                <div className="lg:col-span-7 p-6 sm:p-8 rounded-2xl bg-slate-900/60 border border-slate-800 space-y-4">
                                    <h3 className="text-lg font-bold text-slate-100">Send a Direct Message</h3>
                                    
                                    <form 
                                        onSubmit={(e) => {
                                            e.preventDefault();
                                            alert("Thank you! Message form is currently operating in static preview mode. Please email directly at " + PROFILE_DATA.emails[0]);
                                        }}
                                        className="space-y-4"
                                    >
                                        <div className="grid grid-cols-1 sm:grid-cols-2 gap-4">
                                            <div className="space-y-1">
                                                <label className="text-xs font-medium text-slate-400">Your Name</label>
                                                <input 
                                                    type="text" 
                                                    required 
                                                    placeholder="Jane Doe"
                                                    className="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-800 focus:outline-none focus:border-cyan-500 text-slate-200"
                                                />
                                            </div>
                                            <div className="space-y-1">
                                                <label className="text-xs font-medium text-slate-400">Email Address</label>
                                                <input 
                                                    type="email" 
                                                    required 
                                                    placeholder="jane@example.com"
                                                    className="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-800 focus:outline-none focus:border-cyan-500 text-slate-200"
                                                />
                                            </div>
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-xs font-medium text-slate-400">Subject</label>
                                            <input 
                                                type="text" 
                                                required 
                                                placeholder="Opportunity / Collaboration Inquiry"
                                                className="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-800 focus:outline-none focus:border-cyan-500 text-slate-200"
                                            />
                                        </div>

                                        <div className="space-y-1">
                                            <label className="text-xs font-medium text-slate-400">Message</label>
                                            <textarea 
                                                rows={4} 
                                                required 
                                                placeholder="Write your message here..."
                                                className="w-full px-3 py-2 text-xs rounded-lg bg-slate-950 border border-slate-800 focus:outline-none focus:border-cyan-500 text-slate-200 resize-none"
                                            />
                                        </div>

                                        <button
                                            type="submit"
                                            className="w-full py-2.5 rounded-lg text-xs font-bold bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-slate-950 transition-all shadow-md shadow-cyan-500/20"
                                        >
                                            Send Message
                                        </button>
                                    </form>
                                </div>
                            </div>
                        </section>

                    </main>

                    {/* Footer */}
                    <footer className="border-t border-slate-800/80 bg-slate-950 py-8 text-slate-500 text-xs">
                        <div className="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 flex flex-col sm:flex-row items-center justify-between gap-4">
                            <div className="space-y-1 text-center sm:text-left">
                                <p className="font-semibold text-slate-400">{PROFILE_DATA.name} — AI & Data Science Portfolio</p>
                                <p className="text-[11px]">Deployed directly on GitHub Pages root using static HTML, React UMD & Tailwind CSS.</p>
                            </div>

                            <div className="flex items-center gap-4 text-slate-400">
                                <a href={PROFILE_DATA.github} target="_blank" rel="noreferrer" className="hover:text-cyan-400">GitHub</a>
                                <a href={PROFILE_DATA.linkedin} target="_blank" rel="noreferrer" className="hover:text-cyan-400">LinkedIn</a>
                                <a href="#hero" className="hover:text-cyan-400">Back to Top ↑</a>
                            </div>
                        </div>
                    </footer>

                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
